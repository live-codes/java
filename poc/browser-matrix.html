<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>java-wasm browser matrix</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1.5rem auto; max-width: 880px; line-height: 1.5; }
      .row { border: 1px solid #ccc; padding: 0.5rem 0.7rem; margin: 0.4rem 0; font-size: 14px; }
      .pass { border-left: 5px solid #2a9d3f; }
      .fail { border-left: 5px solid #d33; }
      pre { background: #f6f6f6; padding: 0.4rem; white-space: pre-wrap; margin: 0.3rem 0 0; font-size: 12px; }
      h1 { font-size: 16px; }
    </style>
  </head>
  <body>
    <h1>@live-codes/java-wasm — browser matrix</h1>
    <div id="out"></div>
    <script src="/dist/java-wasm.iife.js"></script>
    <script>
      const out = document.querySelector('#out');
      window.matrix = { done: false, features: {}, cases: [] };

      const addRow = (label, pass, detail) => {
        const el = document.createElement('div');
        el.className = 'row ' + (pass ? 'pass' : 'fail');
        el.innerHTML = `<b>${label}</b>: ${pass ? 'PASS' : 'FAIL'}<pre></pre>`;
        el.querySelector('pre').textContent = detail || '';
        out.appendChild(el);
        return el;
      };

      // The same probe teavm-javac uses: a module importing wasm:js-string.fromCharCode,
      // which requires both WasmGC and the JS-string builtins.
      const GC_JS_STRING_PROBE = new Uint8Array([
        0, 97, 115, 109, 1, 0, 0, 0, 1, 7, 1, 96, 1, 127, 1, 100, 111, 2, 31, 1, 14, 119, 97, 115, 109, 58, 106,
        115, 45, 115, 116, 114, 105, 110, 103, 12, 102, 114, 111, 109, 67, 104, 97, 114, 67, 111, 100, 101, 0, 0, 3, 1,
        0, 5, 4, 1, 1, 0, 0, 7, 10, 1, 6, 109, 101, 109, 111, 114, 121, 2, 0, 10, 129, 128, 128, 0, 0,
      ]);

      (async () => {
        const w = window.WebAssembly;
        const features = {
          userAgent: navigator.userAgent,
          webassembly: typeof w === 'object',
          jstTag: typeof w?.JSTag !== 'undefined',
          suspending: typeof w?.Suspending === 'function',
          promising: typeof w?.promising === 'function',
          gcJsStringValidate: false,
          gcJsStringCompile: false,
        };
        try {
          features.gcJsStringValidate = w.validate(GC_JS_STRING_PROBE);
        } catch (e) {
          features.gcJsStringValidate = 'threw: ' + e.message;
        }
        try {
          await w.compile(GC_JS_STRING_PROBE, { builtins: ['js-string'] });
          features.gcJsStringCompile = true;
        } catch (e) {
          features.gcJsStringCompile = 'threw: ' + e.message;
        }
        window.matrix.features = features;

        addRow(
          'browser',
          !!features.gcJsStringCompile,
          `${features.userAgent}\nJSPI: JSTag=${features.jstTag} Suspending=${features.suspending} ` +
            `promising=${features.promising}\nWasmGC + js-string: validate=${features.gcJsStringValidate} compile=${features.gcJsStringCompile}`
        );

        const HELLO = `public class Main {
  public static void main(String[] args) { System.out.println("Hello from Java"); }
}`;
        const MODERN = `import java.util.stream.Stream;
public class Main {
  record Point(int x, int y) {}
  public static void main(String[] args) {
    var pts = Stream.of(new Point(1, 2)).map(p -> new Point(p.x() * 10, p.y() * 10)).toList();
    System.out.println(pts);
  }
}`;
        const STDIN = `import java.io.BufferedReader;
import java.io.InputStreamReader;
public class Main {
  public static void main(String[] args) throws Exception {
    System.out.println("echo: " + new BufferedReader(new InputStreamReader(System.in)).readLine());
  }
}`;

        let runtime = null;
        try {
          const t0 = performance.now();
          runtime = await JavaWasm.createRuntime({ baseUrl: '/dist/' });
          window.matrix.initMs = Math.round(performance.now() - t0);
        } catch (e) {
          const msg = String((e && e.stack) || e);
          addRow('engine init', false, msg);
          window.matrix.cases.push({ id: 'init', pass: false, error: msg });
          window.matrix.done = true;
          return;
        }

        const runCase = async (id, source, options) => {
          const t = performance.now();
          let pass = false;
          let detail = '';
          try {
            const r = await runtime.run(source, options);
            pass = r.ok && r.exitCode === 0;
            detail = `${Math.round(performance.now() - t)} ms · compile ${Math.round(r.compileMs || 0)} / generate ${Math.round(r.generateMs || 0)} / run ${Math.round(r.runMs || 0)} ms\n${r.stdout || ''}${r.stderr || ''}`;
          } catch (e) {
            detail = String((e && e.message) || e);
          }
          addRow(id, pass, detail);
          window.matrix.cases.push({ id, pass, detail });
        };

        await runCase('java hello', HELLO);
        await runCase('modern java (records, var, stream)', MODERN);
        await runCase('java stdin', STDIN, { input: 'livecodes\n' });

        runtime.destroy();
        window.matrix.done = true;
      })();
    </script>
  </body>
</html>
