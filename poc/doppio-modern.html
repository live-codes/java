<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PoC — doppio-modern (seo-rii fork: Java + Kotlin + Scala)</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="./bench.js"></script>
    <script>
      Bench.runSuite(
        {
          engine: 'doppio-modern',
          title: 'Doppio-modern — seo-rii/doppio <code>modern</code> branch (Java + Kotlin 2.4 + Scala 2.13.18)',
          notes:
            'Mirrors the fork’s own playground: BrowserFS XmlHttpRequest FS backed by <code>seorii.page/doppio/playground/runtime/listings.json</code> (lazy jar fetch), javac / K2JVMCompiler / scalac via <code>Doppio.VM.CLI</code>.',
          worker: 'doppio-modern-worker.js (classic, importScripts + XHR-FS from seorii.page)',
          programs: [].concat(Bench.PROGRAMS.java, Bench.PROGRAMS.kotlin, Bench.PROGRAMS.scala),
        },
        {
          async init() {
            const worker = new Worker('./doppio-modern-worker.js');
            const init = await new Promise((resolve, reject) => {
              worker.onerror = (e) => reject(new Error('worker error: ' + e.message));
              worker.onmessage = (e) => {
                if (e.data.type === 'initialized') resolve(e.data);
                if (e.data.type === 'init-error') reject(new Error(e.data.error));
              };
              worker.postMessage({ cmd: 'init' });
            });
            return { worker, init };
          },
          async run(handle, program) {
            const language = program.id.startsWith('java') ? 'java' : program.id.startsWith('kotlin') ? 'kotlin' : 'scala';
            return await new Promise((resolve, reject) => {
              handle.worker.onmessage = (e) => {
                if (e.data.type === 'result') {
                  if (e.data.ok === false && e.data.error) e.data.stderr = (e.data.stderr || '') + '\n' + e.data.error;
                  resolve({ ...e.data, bytes: null, internalMs: parseInternal(e.data.stdout) });
                }
              };
              handle.worker.onerror = (e) => reject(new Error('worker error: ' + e.message));
              handle.worker.postMessage({ cmd: 'run', language, source: program.source, input: program.input || '' });
            });
          },
        }
      );

      function parseInternal(stdout) {
        const m = /internalMs=(\d+)/.exec(stdout || '');
        return m ? Number(m[1]) : null;
      }
    </script>
  </body>
</html>
